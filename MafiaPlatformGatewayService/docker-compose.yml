version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --protected-mode no --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped

  gateway-service:
    image: dimaubuntu/gateway-service:latest
    container_name: gateway-service
    ports:
      - "8088:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SERVICES_USER_URL=${SERVICES_USER_URL}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: