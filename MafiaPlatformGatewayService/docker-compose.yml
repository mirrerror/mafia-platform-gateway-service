services:
  redis-gateway:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --protected-mode no --appendonly yes
    volumes:
      - redis-gateway-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped

  db_town_service:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TOWN_SERVICE_POSTGRES_DB}
    ports:
      - "${TOWN_SERVICE_POSTGRES_DB_PORT}:5432"
    volumes:
      - town_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TOWN_SERVICE_POSTGRES_USER} -d ${TOWN_SERVICE_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db_character_service:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${CHARACTER_SERVICE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${CHARACTER_SERVICE_POSTGRES_DB}
    ports:
      - "${CHARACTER_SERVICE_POSTGRES_DB_PORT}:5432"
    volumes:
      - character_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CHARACTER_SERVICE_POSTGRES_USER} -d ${CHARACTER_SERVICE_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  gateway-service:
#    build: .
    image: iraned/gateway-service:1.1
    container_name: gateway-service
    ports:
      - "8088:8080"
    depends_on:
      - redis-gateway
      - communication-service
    environment:
      - SPRING_REDIS_HOST=redis-gateway
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SERVICES_USER_URL=${SERVICES_USER_URL}
      - COMMUNICATION_SERVICE_HOST=communication-service
      - COMMUNICATION_SERVICE_PORT=8080
      - RUMOURS_SERVICE_HOST=rumours-service
      - RUMOURS_SERVICE_PORT=8080
      - CHARACTER_SERVICE_HOST=character-service
      - CHARACTER_SERVICE_PORT=8081
      - TOWN_SERVICE_HOST=town-service
      - TOWN_SERVICE_PORT=8080
      - TASK_SERVICE_HOST=task-service
      - TASK_SERVICE_PORT=8000
      - VOTING_SERVICE_HOST=voting-service
      - VOTING_SERVICE_PORT=8000
    networks:
      - app-network
    command: ["/wait-for.sh", "communication-service", "8080", "java", "-jar", "gateway-service.jar"]

  town-service:
    image: dimaubuntu/town-service:latest
    environment:
      - TOWN_SERVICE_POSTGRES_HOST=db_town_service
      - TOWN_SERVICE_POSTGRES_DB_PORT=5432
      - TOWN_SERVICE_POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - TOWN_SERVICE_POSTGRES_PASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
      - TOWN_SERVICE_POSTGRES_DB=${TOWN_SERVICE_POSTGRES_DB}
      - SERVER_PORT=8080
    ports:
      - "8082:8080"
    depends_on:
      db_town_service:
        condition: service_healthy
    networks:
      - app-network

  character-service:
    image: dimaubuntu/character-service:latest
    container_name: character-service
    environment:
      - CHARACTER_SERVICE_POSTGRES_HOST=db_character_service
      - CHARACTER_SERVICE_POSTGRES_DB_PORT=5432
      - CHARACTER_SERVICE_POSTGRES_USER=${CHARACTER_SERVICE_POSTGRES_USER}
      - CHARACTER_SERVICE_POSTGRES_PASSWORD=${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      - CHARACTER_SERVICE_POSTGRES_DB=${CHARACTER_SERVICE_POSTGRES_DB}
      - SERVER_PORT=8081
    ports:
      - "8083:8081"
    depends_on:
      db_character_service:
        condition: service_healthy
    networks:
      - app-network

  db_rumours_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${RUMOURS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RUMOURS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUMOURS_POSTGRES_DB}
    ports:
      - "${RUMOURS_POSTGRES_DB_PORT}:5432"
    volumes:
      - rumours_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RUMOURS_POSTGRES_USER} -d ${RUMOURS_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rumours-service:
    image: m1rrerror/mafia-rumours-service:latest
    environment:
      DB_CONNECTION_STRING: "Host=db_rumours_service;Port=5432;Database=${RUMOURS_POSTGRES_DB};Username=${RUMOURS_POSTGRES_USER};Password=${RUMOURS_POSTGRES_PASSWORD}"
      GATEWAY_SERVICE_URL: ${GATEWAY_SERVICE_URL}
    ports:
      - "8084:8080"
    depends_on:
      db_rumours_service:
        condition: service_healthy
    networks:
      - app-network

  db_communication_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${COMM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${COMM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${COMM_POSTGRES_DB}
    ports:
      - "${COMM_POSTGRES_DB_PORT}:5432"
    volumes:
      - communication_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${COMM_POSTGRES_USER} -d ${COMM_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  communication-service:
    image: m1rrerror/mafia-communication-service:latest
    environment:
      ConnectionStrings__DefaultConnection: "Host=db_communication_service;Port=5432;Database=${COMM_POSTGRES_DB};Username=${COMM_POSTGRES_USER};Password=${COMM_POSTGRES_PASSWORD}"
    ports:
      - "8085:8080"
    depends_on:
      db_communication_service:
        condition: service_healthy
    networks:
      - app-network

  db_voting_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${VOTING_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VOTING_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${VOTING_SERVICE_POSTGRES_DB}
    ports:
      - "${VOTING_SERVICE_POSTGRES_PORT}:5432"
    networks:
      - app-network
    volumes:
      - voting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${VOTING_SERVICE_POSTGRES_USER} -d ${VOTING_SERVICE_POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  voting-service:
    image: iraned/voting-service:latest
    working_dir: /app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VOTING_SERVICE_POSTGRES_USER: ${VOTING_SERVICE_POSTGRES_USER}
      VOTING_SERVICE_POSTGRES_PASSWORD: ${VOTING_SERVICE_POSTGRES_PASSWORD}
      VOTING_SERVICE_POSTGRES_DB: ${VOTING_SERVICE_POSTGRES_DB}
      VOTING_SERVICE_DB_HOST: db_voting_service
      VOTING_SERVICE_POSTGRES_PORT: 5432
    networks:
      - app-network
    depends_on:
      db_voting_service:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: task-service-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${TASK_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TASK_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASK_SERVICE_POSTGRES_DB}
    ports:
      - "5469:5432"
    volumes:
      - task_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TASK_SERVICE_POSTGRES_USER} -d ${TASK_SERVICE_POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  task-service:
    image: iraned/task-service:latest
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # БД (внутренние переменные, которые читает app.py)
      POSTGRES_USER: ${TASK_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TASK_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASK_SERVICE_POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  redis-gateway-data:
  town_postgres_data:
  character_postgres_data:
  rumours_postgres_data:
  communication_postgres_data:
  voting_postgres_data:
  task_pgdata: