spring.application.name=MafiaPlatformGatewayService
spring.jpa.properties.hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
spring.mvc.hiddenmethod.filter.enabled=true

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:36000000}

services.user.url=${USER_SERVICE_URL:http://localhost:8081}

spring.config.import=optional:file:.env[.properties]

server.address=0.0.0.0
server.port=8080

spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms
spring.data.redis.database=0

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
