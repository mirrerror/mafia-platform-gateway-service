syntax = "proto3";

package task;

option java_package = "md.faf223.mafiaplatformgatewayservice.grpc.task";
option java_outer_classname = "TaskServiceProto";

service TaskService {
  rpc AssignTask(AssignTaskRequest) returns (AssignTasksResponse);
  rpc GetPlayerTasks(GetPlayerTasksRequest) returns (TasksListResponse);
  rpc GetAllTasks(GetAllTasksRequest) returns (TasksListResponse);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateStatusResponse);
  rpc HandleMovement(MovementEventRequest) returns (MovementEventResponse);
}


message Reward {
  int32 coins = 1;
  int32 diamonds = 2;
}

message TaskView {
  int64 id = 1;
  string name = 2;
  string description = 3;
  Reward reward = 4;
  string status = 5;
  string location = 6;
  int64 player_id = 7;
  int32 day_number = 8;
}

// --- Request/Response Messages ---

message AssignTaskRequest {
  int64 game_id = 1;
  int64 player_id = 2;
  string career = 3;
  int32 day_number = 4;
}

message AssignTasksResponse {
  int64 player_id = 1;
  int64 game_id = 2;
  string player_career = 3;
  string player_role = 4;
  repeated TaskView tasks = 5;
}

message GetPlayerTasksRequest {
  int64 game_id = 1;
  int64 player_id = 2;
  optional int32 day_number = 3;
}

message GetAllTasksRequest {
  int64 game_id = 1;
  optional int32 day_number = 2;
}

message TasksListResponse {
  repeated TaskView tasks = 1;
}

message UpdateTaskStatusRequest {
  int64 game_id = 1;
  int64 task_id = 2;
  string status = 3;
}

message UpdateStatusResponse {
  int64 task_id = 1;
  string status = 2;
  Reward reward = 3;
}

message MovementEventRequest {
  int64 game_id = 1;
  int64 player_id = 2;
  int32 location_id = 3;
}

message MovementEventResponse {
  int64 game_id = 1;
  int64 player_id = 2;
  int64 location_id = 3;
  string location_name = 4;
  repeated int64 updated_task_ids = 5;
  string result = 6;
}