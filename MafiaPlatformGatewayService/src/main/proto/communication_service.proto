syntax = "proto3";

package communication;

option java_package = "md.faf223.mafiaplatformgatewayservice.grpc.communication";
option java_outer_classname = "CommunicationServiceProto";

service CommunicationService {
  rpc GetLobby (LobbyRequest) returns (LobbyResponse);
  rpc CreateLobby (CreateLobbyRequest) returns (LobbyResponse);
  rpc DeleteLobby (LobbyRequest) returns (DeleteLobbyResponse);

  rpc SendGlobalMessage (GlobalMessageRequest) returns (ChatResponse);
  rpc GetGlobalChatHistory (LobbyRequest) returns (ChatHistoryResponse);
  rpc ToggleGlobalChat (LobbyRequest) returns (GlobalChatStatusResponse);
  rpc GetGlobalChatStatus (LobbyRequest) returns (GlobalChatStatusResponse);

  rpc SendPrivateMessage (PrivateMessageRequest) returns (PrivateChatResponse);
  rpc GetPrivateChatHistory (GetPrivateHistoryRequest) returns (PrivateChatHistoryResponse);
  rpc GetPrivateChannels (LobbyRequest) returns (PrivateChannelsListResponse);

  rpc SendAnnouncement (AnnouncementRequest) returns (AnnouncementResponse);
  rpc GetAnnouncementHistory (LobbyRequest) returns (AnnouncementHistoryResponse);
}

message LobbyRequest {
  string lobby_id = 1;
}

message PrivateChannelMember {
  string name = 1;
  map<string, bool> members = 2;
}

message LobbyResponse {
  string id = 1;
  map<string, PrivateChannelMember> private_channels = 2;
}

message CreateLobbyRequest {
  string lobby_id = 1;
  repeated PrivateChannelInput private_channels = 2;
}

message PrivateChannelInput {
  string channel_name = 1;
  repeated int64 member_ids = 2;
}

message DeleteLobbyResponse {
  string message = 1;
}

message GlobalMessageRequest {
  string lobby_id = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string content = 4;
}

message ChatResponse {
  string lobby_id = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string content = 4;
  string timestamp = 5;
}

message ChatHistoryResponse {
  repeated ChatResponse messages = 1;
}

message GlobalChatStatusResponse {
  string lobby_id = 1;
  bool is_global_chat_enabled = 2;
}

message PrivateMessageRequest {
  string lobby_id = 1;
  string channel_name = 2;
  int64 sender_id = 3;
  string sender_name = 4;
  string content = 5;
}

message PrivateChatResponse {
  string lobby_id = 1;
  string channel_name = 2;
  int64 sender_id = 3;
  string sender_name = 4;
  string content = 5;
  string timestamp = 6;
}

message GetPrivateHistoryRequest {
  string lobby_id = 1;
  string channel_name = 2;
  int64 user_id = 3;
}

message PrivateChatHistoryResponse {
  repeated PrivateChatResponse messages = 1;
}

message PrivateChannelsListResponse {
  repeated string channels = 1;
}

message AnnouncementRequest {
  string lobby_id = 1;
  string content = 2;
}

message AnnouncementResponse {
  string id = 1;
  string lobby_id = 2;
  string content = 3;
  string timestamp = 4;
}

message AnnouncementHistoryResponse {
  repeated AnnouncementResponse announcements = 1;
}