syntax = "proto3";

package com.pad.lab.servicediscovery.grpc;

option java_package = "com.pad.lab.servicediscovery.grpc";
option java_outer_classname = "RegistrationProto";

service RegistrationService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
}

service DiscoveryQueryService {
  // Replaces GET /api/discovery/services/{serviceId}/instance
  rpc GetBestInstance(GetBestInstanceRequest) returns (ServiceInstanceMessage);
}

message GetBestInstanceRequest {
  string service_id = 1;
}

message ServiceInstanceMessage {
  string instance_id = 1;
  string service_id = 2;
  string host = 3;
  int32 rest_port = 4;
  int32 rpc_port = 5;
  string topic_name = 6;
}

message RegisterRequest {
  string service_id = 1;
  string host = 2;
  int32 rest_port = 3;
  int32 rpc_port = 4;
  string topic_name = 5;
}
message RegisterResponse {
  string status = 1;
  string instance_id = 2;
  string service_id = 3;
}
message DeregisterRequest {
  string instance_id = 1;
}
message DeregisterResponse {
  string status = 1;
  string instance_id = 2;
}